name: Deploy to Server
on:
  push:
    branches: [ main ]
jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: server226.web-hosting.com
          username: pseo@pseo.chatgptadvertising.agency
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /pseo.chatgptadvertising.agency/wp-content/themes/chatgpt-pseo/
