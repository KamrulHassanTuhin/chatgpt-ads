name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: server226.web-hosting.com
          username: pseo@pseo.chatgptadvertising.agency
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /pseo.chatgptadvertising.agency/wp-content/themes/chatgpt-pseo/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .vscode/**
